name: Marketplace regression

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      upload_evidence:
        description: "Upload potentially sensitive traces/screenshots (review access first)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: marketplace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      WORKERS: "2"
      BASE_URL: https://qa-marketplace-app-b9mpo.ondigitalocean.app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun run test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.upload_evidence }}
        with:
          name: marketplace-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
