name: QA delivery pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      upload_evidence:
        description: "Upload potentially sensitive live-site evidence (review access first)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: qa-delivery-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  WORKERS: "2"
  BASE_URL: https://qa-marketplace-app-b9mpo.ondigitalocean.app
  # Synthetic account mutations are never part of automatic CI.
  RUN_ACCOUNT_TESTS: "0"
  CREATE_SYNTHETIC_ACCOUNT: "0"
  RUN_DEMO_TESTS: "0"
  AUTHORIZE_DEMO_CHECKOUT: "0"

jobs:
  quality:
    name: Lint and type checking
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run lint
      - run: bun run typecheck

  unit:
    name: Unit tests and coverage
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: mkdir -p coverage/unit
      - run: bun run test:unit:coverage --reporter=junit --reporter-outfile=coverage/unit/junit.xml
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: unit-coverage-and-junit
          path: coverage/unit/
          retention-days: 7

  integration:
    name: Local HTTP and browser integration
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:integration
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: local-integration-evidence
          path: |
            playwright-report-integration/
            test-results-integration/
          retention-days: 7

  live-api:
    name: Live QA API contracts
    needs: [unit, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run test:api
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.upload_evidence }}
        with:
          name: live-api-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  browser-regression:
    name: Live cross-browser and mobile regression
    needs: [unit, integration, live-api]
    # Keep browser evidence even when a genuine API defect makes live-api fail.
    # Do not continue if either deterministic layer failed, or if the run was cancelled.
    if: ${{ !cancelled() && needs.unit.result == 'success' && needs.integration.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun run test:frontend
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.upload_evidence }}
        with:
          name: live-browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
