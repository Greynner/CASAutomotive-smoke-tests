name: Set up QA tooling
description: Install pinned Bun and dependencies using the committed lockfile.
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3.6"
    - uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-1.3.6-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-1.3.6-
    - run: bun install --frozen-lockfile
      shell: bash
