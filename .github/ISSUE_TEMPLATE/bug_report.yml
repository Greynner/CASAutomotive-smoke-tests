name: Reproducible marketplace bug
description: Prioritized defect with expected vs actual behavior and safe evidence.
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [P1 - high, P2 - medium, P3 - low]
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and scope
      description: URL, browser/version, viewport, run date, impact. No credentials or personal data.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and automated reproduction
      description: Minimal numbered steps and the Playwright command/test title.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior and source
      description: Link to the applicable Help Center rule or explain the user expectation.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Redacted screenshots or assertion output. Never upload raw traces, cookies, tokens, emails or payment details to public issues.
